# ===============================================================
# TradeInsight 桌面版 profile（--spring.profiles.active=desktop）
# 关系型元数据：嵌入式 H2（用户/同步状态/模拟训练）
# 行情时序数据：DolphinDB（日K/指数/板块/涨跌停池）
# AKTools 行情：本地/远程 python -m aktools --port 8888
# 数据文件存放在 app.data.dir（由 Electron 通过 -Dapp.data.dir 注入，
# 默认回退到 ./data）
# ===============================================================
server:
  port: 8080

spring:
  datasource:
    driver-class-name: org.h2.Driver
    # MODE=MySQL 提供 MySQL 兼容语法（DATE_SUB/ON DUPLICATE KEY UPDATE 等）
    url: jdbc:h2:file:${app.data.dir:./data}/tradeinsight;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER;AUTO_SERVER=TRUE
    username: sa
    password:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 2
      min-idle: 2
      max-active: 10
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  jpa:
    hibernate:
      # 桌面版由 JPA 根据实体自动建表/更新字段（仅关系型元数据实体）
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000

  main:
    allow-bean-definition-overriding: true

# DolphinDB 时序数据库（桌面版默认连本地实例）
dolphindb:
  host: ${DOLPHINDB_HOST:localhost}
  port: ${DOLPHINDB_PORT:8848}
  username: ${DOLPHINDB_USERNAME:admin}
  password: ${DOLPHINDB_PASSWORD:123456}
  database: ${DOLPHINDB_DB:dfs://tradeinsight}
  auto-create-schema: ${DOLPHINDB_AUTO_CREATE:true}
  pool:
    initial-size: 2
    min-idle: 2
    max-active: 10
    max-wait: 60000

# MyBatis-Plus 与主配置保持一致
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    org.springframework: WARN
    com.gsxi.trading.tradeinsight: INFO
  file:
    name: ${app.data.dir:./data}/logs/backend.log

# AKTOOLS 行情服务（本地运行 python -m aktools --port 8888；
# 未运行时行情相关接口会报错，其余功能不受影响）
aktools:
  api:
    base-url: ${AKTOOLS_API_URL:http://localhost:8888/api/public}
    connect-timeout: 10000
    read-timeout: 30000

# 桌面版关闭性能监控告警等噪声
tradeinsight:
  performance:
    monitor:
      enabled: false
      alert-enabled: false
