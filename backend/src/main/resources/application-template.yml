
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/TradeInsight?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:your_username}
    password: ${DB_PASSWORD:your_password}
    # 指定使用 Druid 数据源（必须配置）——仅承载关系型元数据
    type: com.alibaba.druid.pool.DruidDataSource

    # Druid 连接池配置
    druid:
      initial-size: 5        # 初始化连接数（默认0）
      min-idle: 5            # 最小空闲连接数（默认0）
      max-active: 20         # 最大活跃连接数（默认8）
      max-wait: 60000        # 获取连接最大等待时间（毫秒，默认-1无限等待）
      time-between-eviction-runs-millis: 60000              # 检测空闲连接的间隔时间（毫秒）
      min-evictable-idle-time-millis: 300000              # 连接保持空闲的最小时间（毫秒），超过此时间可能被回收
      validation-query: SELECT 1              # 检测连接有效性的SQL语句
      test-while-idle: true             # 是否在空闲时检测连接有效性
      test-on-borrow: false           # 是否在获取连接时检测有效性（影响性能）
      test-on-return: false          # 是否在归还连接时检测有效性（影响性能）

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}  # 如果有密码请设置环境变量
      jedis:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0
      timeout: 2000

# DolphinDB 时序数据库（行情数据存储与分析）
dolphindb:
  host: ${DOLPHINDB_HOST:localhost}
  port: ${DOLPHINDB_PORT:8848}
  username: ${DOLPHINDB_USERNAME:admin}
  password: ${DOLPHINDB_PASSWORD:123456}
  database: ${DOLPHINDB_DB:dfs://tradeinsight}
  auto-create-schema: ${DOLPHINDB_AUTO_CREATE:true}
  pool:
    initial-size: 2
    min-idle: 2
    max-active: 10
    max-wait: 60000

# AKTOOLS API 配置
aktools:
  api:
    # AKTOOLS API 服务地址
    base-url: ${AKTOOLS_API_URL:http://localhost:8888/api/public}
    # 连接超时时间（毫秒）
    connect-timeout: 10000
    # 读取超时时间（毫秒）
    read-timeout: 30000
